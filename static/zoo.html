<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Animal viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#eef3f6; --panel:#ffffff; --line:#d6e0e6; --text:#16232b; --muted:#60717c; --accent:#0e7490; color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; }
  body { font:14px/1.4 system-ui, Segoe UI, sans-serif; background:var(--bg); color:var(--text); overflow:hidden; }
  #view { position:absolute; inset:0; }
  #view canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #panel { position:absolute; left:12px; top:12px; width:260px; background:rgba(255,255,255,.92); border:1px solid var(--line);
           border-radius:10px; padding:12px; z-index:2; }
  #panel h1 { font-size:15px; margin:0 0 8px; }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:8px 0; }
  .row label { color:var(--muted); font-size:12px; min-width:64px; }
  button, select, input[type=range] { font:inherit; }
  button { background:#f1f5f8; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  select { background:#f3f6f8; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:4px 6px; }
  .pill { padding:2px 9px; border-radius:10px; background:#f1f5f8; color:var(--muted); font-size:12px; }
  #fps { position:absolute; right:12px; top:12px; z-index:2; }
  #hint { position:absolute; left:12px; bottom:12px; z-index:2; font-size:11px; }
</style>
</head>
<body>
<div id="view"></div>
<div id="panel">
  <h1>Animal viewer</h1>
  <div class="row"><label>Animal</label><select id="animal"><option value="cat">Cat</option></select></div>
  <div class="row"><label>Coat</label><select id="coat"></select></div>
  <div class="row"><label>State</label><span id="states" style="display:flex;gap:6px;flex-wrap:wrap"></span></div>
  <div class="row"><label>Speed</label><input id="speed" type="range" min="0.1" max="2" step="0.05" value="1"><span id="speedVal" class="pill">1.0x</span></div>
  <div class="row"><label></label><button id="pause">Pause</button><button id="treadmill" class="on">Ground moves</button></div>
  <div class="row"><label>View</label>
    <button data-cam="three">3/4</button><button data-cam="side">Side</button><button data-cam="front">Front</button><button data-cam="top">Top</button>
  </div>
</div>
<span class="pill" id="fps">- fps</span>
<span class="pill" id="hint">drag: orbit · right-drag or shift-drag: pan · wheel: zoom · double-click: reset · arrows, +/-, WASD, R reset, C turntable</span>
<script type="module" src="/static/zoo.js"></script>
</body>
</html>
